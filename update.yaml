---
# Update and/or Upgrade Linux
# File: update.yaml

- name: "Update OS packages for Linux"
  hosts: all
  become: yes
  vars:
    ansible_ssh_pipelining: true

  roles:
    - role: update

  handlers:
  - name: "Reboot after installing updates"
    ansible.builtin.reboot:
      msg: "Rebooting after installing updates."
    listen: "reboot"
